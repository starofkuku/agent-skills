interface:
  display_name: "Plain Change Report"
  short_description: "Explain code changes in plain language for non-technical readers"
  default_prompt: "Use $plain-change-report to write a plain-language report for non-technical readers, grouped by change type and tagged with the business module, and save it to CHANGE-REPORT.local.md. With no argument it reports uncommitted changes; support --since <tag/commit>, --commits <sha...> and --last <N> to report a range of commits, always describing the net result rather than the intermediate steps."
