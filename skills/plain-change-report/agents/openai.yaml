interface:
  display_name: "Plain Change Report"
  short_description: "Explain code changes in plain language for non-technical readers"
  default_prompt: "Use $plain-change-report to write a plain-language report for non-technical readers, grouped by change type and tagged with the business module. Output the report directly in the conversation and do NOT write any file (no CHANGE-REPORT.local.md, no temp files, no .gitignore/exclude edits). With no argument it reports uncommitted changes; support --since <tag/commit> and --last <N> for commit ranges, --from <tag> [--to <tag>] for the net change between two release tags (range is from..to and EXCLUDES what the from tag itself introduced; never use from^..to) pairing with publish-merge auto tags, --mine to summarize only the caller's own commits and exclude upstream syncs (mention them in one line), --commits <sha...> for specific commits, and --repo <names> to limit repositories. Always describe the net result rather than intermediate steps. When run from a workspace containing multiple repos (e.g. frontend and backend in separate repos), discover the sub-repos, include only those with changes unless --repo is given, and merge frontend and backend changes of the same feature into a single item."
