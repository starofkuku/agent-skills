interface:
  display_name: "Plain Change Report"
  short_description: "Explain code changes in plain language for non-technical readers"
  default_prompt: "Use $plain-change-report to write a plain-language report for non-technical readers, grouped by change type and tagged with the business module, and save it to CHANGE-REPORT.local.md. With no argument it reports uncommitted changes; support --since <tag/commit>, --commits <sha...>, --last <N> for commit ranges and --repo <names> to limit repositories, always describing the net result rather than intermediate steps. When run from a workspace containing multiple repos (e.g. frontend and backend in separate repos), discover the sub-repos, include only those with changes unless --repo is given, and merge frontend and backend changes of the same feature into a single item."
