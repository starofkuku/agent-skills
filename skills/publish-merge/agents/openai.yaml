interface:
  display_name: "Publish Merge"
  short_description: "Merge a branch into another, push, and tag master releases locally"
  default_prompt: "Use $publish-merge to merge the source branch into the target branch, push it, and switch back to the source branch. When the target branch is the repository main branch (main or master), also automatically create the next semver tag on the merge commit (start at v0.0.1 if no v* tag exists in that series, otherwise bump patch of the latest; lowercase v only; annotated) but DO NOT push the tag — it stays local as the release anchor and is only pushed when the user explicitly asks; when merging into any other branch such as develop or test, do not create a tag. --prefix <prefix> tags a separate series, e.g. --prefix ieioms produces ieioms-v0.0.1, ieioms-v0.0.2, independent of the bare v* series. Works in plain Git environments with no GitHub required. Use --no-tag to skip tagging and --push-origin to push the source branch first when it is ahead of its remote."
