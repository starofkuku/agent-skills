interface:
  display_name: "Publish Merge"
  short_description: "Merge a branch into another, push, and auto-tag master releases"
  default_prompt: "Use $publish-merge to merge the source branch into the target branch, push it, and switch back to the source branch. When the target branch is the repository main branch (main or master), also automatically create the next semver tag on the merge commit (start at v0.0.1 if no v* tag exists, otherwise bump patch of the latest v* tag; lowercase v only; annotated) and push it; when merging into any other branch such as develop or test, do not create a tag. Works in plain Git environments with no GitHub required; on GitHub, pushing the tag may also trigger v*-triggered workflows. Use --no-tag to skip tagging and --push-origin to push the source branch first when it is ahead of its remote."
